services:
  blender:
    build:
      # The repository root, so the image can install the server's dependencies
      # from pyproject.toml (Dockerfile.dockerignore trims the context).
      context: ../..
      dockerfile: docker/blender/Dockerfile
    # Blender only ships x86_64 Linux builds; force amd64 even on arm64 hosts
    # (e.g. Apple Silicon), which run it correctly under emulation.
    platform: linux/amd64
    volumes:
      - ../..:/repo:ro
      - ./output:/output
    environment:
      # Reported to the MCP server through get_addon_info, so the agent knows
      # which container path actually reaches the host. Nothing in the codebase
      # hardcodes /output - a local (non-container) Blender simply leaves this
      # unset and reports its own defaults instead.
      BLENDERMCP_OUTPUT_ROOTS: /output
    # Only the MCP server is published: this container stands in for a remote
    # host, and Blender's own socket never leaves it. Bound to loopback
    # deliberately - there is no authentication, so publishing on 0.0.0.0 would
    # let anyone who can reach this host drive Blender, including reading and
    # writing files. Change this only for a host you trust the whole network of.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Round-trips both Blender's socket and the MCP endpoint (see the script),
      # so `docker compose up --wait` blocks until an agent could use it.
      test: ["CMD", "/opt/blender-mcp/venv/bin/python", "/opt/healthcheck.py"]
      interval: 2s
      timeout: 8s
      retries: 30
      start_period: 3s
