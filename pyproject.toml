[project]
name = "blender-mcp"
version = "2.0.0"
description = "Blender integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.9.0,<2",
    "pydantic>=2,<3",
]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "phase2_gate: shells out to a live GUI Blender via scripts/blender_rig.py (plan Task 10); skipped unless BLENDERMCP_LIVE_RIG=1 is set and /opt/homebrew/bin/blender exists",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
ignore = [
    "incorrect-blank-line-before-class",
    "missing-trailing-comma",
    "multi-line-summary-first-line",
    "undocumented-public-module",
    "undocumented-public-package",
]
select = [
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "COM",    # flake8-commas
    "D",      # pydocstyle
    "DOC",    # pydoclint
    "E",      # pycodestyle errors
    "ERA",    # eradicate
    "F",      # Pyflakes
    "I",      # isort
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "Q",      # flake8-quotes
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
preview = true

[tool.ruff.lint.isort]
lines-between-types = 1
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]


[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
packages = [{ include = "blender_mcp", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.5"
pytest = ">=8.0"
blender-python-stubs = "^5.2.1.1"
basedpyright = "^1.39.10"
libcst = "^1.9.0"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon/**/*.py"]

[project.urls]
"Homepage" = "https://github.com/ahujasid/blender-mcp"
"Bug Tracker" = "https://github.com/ahujasid/blender-mcp/issues"
