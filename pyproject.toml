[project]
name = "blender-mcp"
version = "2.0.0"
description = "Blender integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.9.0,<2",
    "pydantic>=2,<3",
]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "phase2_gate: shells out to a live GUI Blender via scripts/blender_rig.py; skipped unless BLENDERMCP_LIVE_RIG=1 is set and /opt/homebrew/bin/blender exists",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
# `requests` ships no type information; its absence is not a finding.
reportMissingModuleSource = false

# The add-on talks to live bpy collections, whose stubs widen element types to
# `ID`/`bpy_struct` and lose the concrete datablock. Every reportArgumentType
# raised under this root was that widening, never a reachable state, so the rule
# is off at the Blender boundary and stays on for the MCP server surface.
[[tool.pyright.executionEnvironments]]
root = "src/blender_mcp/bundled"
reportArgumentType = false

[[tool.pyright.executionEnvironments]]
root = "."

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".audit_tmp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
ignore = [
    "incorrect-blank-line-before-class",
    "missing-trailing-comma",
    # D212/D213 are mutually exclusive. The repository's dominant style opens the
    # docstring on its own line, so D212 is the one to silence.
    "multi-line-summary-first-line",
    "undocumented-public-module",
    "undocumented-public-package",
    # MCP tools mirror Blender operator surfaces and are legitimately wide.
    "too-many-arguments",
    "too-many-positional-arguments",
    # Handler classes group related operations; staticmethod churn buys nothing.
    "no-self-use",
]
select = [
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "COM",    # flake8-commas
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "ERA",    # eradicate
    "F",      # Pyflakes
    "I",      # isort
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "Q",      # flake8-quotes
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
preview = true

[tool.ruff.lint.per-file-ignores]
# Add-on handlers take live bpy datablocks. bpy cannot be imported outside
# Blender, so this package is a deliberately bpy-typed boundary; the MCP
# contract surface in server/ stays fully annotated.
"src/blender_mcp/bundled/addon/**" = ["ANN"]
# Blender loads an add-on through its package `__init__`, so `bl_info`, the
# protocol constant and register()/unregister() have to live there.
"src/blender_mcp/bundled/addon/__init__.py" = ["ANN", "non-empty-init-module"]
# gpu does not exist at all outside real Blender (no runtime package, only a type-checking
# stub), and numpy is not installed in this project's own dev/test environment either - a
# module-level import here would break every test that loads this addon package
# (test_mutation_transaction._load_addon and everything built on it), so get_viewport_screenshot's
# GPU capture path must import both lazily, inside the function that actually needs them.
"src/blender_mcp/bundled/addon/handlers/viewport.py" = ["import-outside-top-level"]
# FastMCP injects `ctx: Context` by annotation, not by name, so tools declare it
# without referencing it.
"src/blender_mcp/server/tools/**" = ["unused-function-argument"]
# Tests document themselves through names and assertions.
"tests/**" = ["ANN", "ARG", "D1", "import-outside-top-level", "import-private-name", "PLR09", "PLR17", "magic-value-comparison", "too-many-statements-in-try-clause"]

[tool.ruff.lint.isort]
lines-between-types = 1
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]


[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
packages = [{ include = "blender_mcp", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.5"
pytest = ">=8.0"
blender-python-stubs = "^5.2.1.1"
basedpyright = "^1.39.10"
libcst = "^1.9.0"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon/**/*.py", "addon_surface.json"]

[project.urls]
"Homepage" = "https://github.com/ahujasid/blender-mcp"
"Bug Tracker" = "https://github.com/ahujasid/blender-mcp/issues"
