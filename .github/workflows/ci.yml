name: CI

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The lint gate diffs against the base branch, so it needs history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      # Not `ruff check .`: the tree carries an inherited backlog, so the gate is
      # the lines this branch introduces. `just lint-all` reports the rest.
      # A pull request measures against its base branch; a push against the commit it
      # replaced, or the parent when the push created the branch (all-zero `before`).
      - name: Lint changed lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            BASE="$BEFORE_SHA"
          else
            BASE="HEAD~1"
          fi
          poetry run python scripts/lint_changed.py --base "$BASE"

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Type check
        run: poetry run basedpyright

  test:
    uses: ./.github/workflows/tests.yml
